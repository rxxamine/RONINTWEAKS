<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D54" />
      <stop offset="60%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#8A0B10" />
    </linearGradient>
    <linearGradient id="favArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E202B" />
      <stop offset="100%" stop-color="#08080C" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Hexagonal Base -->
  <polygon points="32,3 57,16 57,48 32,61 7,48 7,16" fill="url(#favArmor)" stroke="#FF1E27" stroke-width="1.8" />
  <polygon points="32,6 54,18 54,46 32,58 10,46 10,18" fill="none" stroke="#FF1E27" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Symmetrical Horns / Katana Crest -->
  <path d="M 32 18 L 24 8 L 15 10 L 23 18 L 17 25 L 27 23 Z" fill="url(#favRedGrad)" />
  <path d="M 32 18 L 40 8 L 49 10 L 41 18 L 47 25 L 37 23 Z" fill="url(#favRedGrad)" />

  <!-- Center Forehead Plate -->
  <path d="M 28 17 L 36 17 L 39 31 L 25 31 Z" fill="#0A0B0F" stroke="#FF1E27" stroke-width="1" />
  <!-- 'R' Mark in Forehead -->
  <path d="M 30 20 L 34 20 C 35.5 20 36 21 36 22.5 C 36 24 35.5 25 34 25 L 30 25 Z M 30 20 L 30 28 M 33 25 L 35.5 28" stroke="#FF1E27" stroke-width="1.2" stroke-linecap="round" />

  <!-- Glowing Laser Visor Slits -->
  <g filter="url(#favGlow)">
    <polygon points="19,34 29,34 27,37 21,37" fill="#FF1E27" />
    <polygon points="35,34 45,34 43,37 37,37" fill="#FF1E27" />
    <polygon points="22,34.5 28,34.5 27,36 23,36" fill="#FFFFFF" opacity="0.9" />
    <polygon points="36,34.5 42,34.5 41,36 37,36" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Lower Faceplate & Grill -->
  <polygon points="23,41 41,41 37,54 27,54" fill="url(#favArmor)" stroke="#FF1E27" stroke-width="1" />
  <line x1="28" y1="44" x2="36" y2="44" stroke="#FF1E27" stroke-width="1" stroke-opacity="0.8" />
  <line x1="29" y1="47" x2="35" y2="47" stroke="#FF1E27" stroke-width="1" stroke-opacity="0.8" />
  <line x1="30" y1="50" x2="34" y2="50" stroke="#FF1E27" stroke-width="1" stroke-opacity="0.8" />
  <polygon points="30,54 34,54 32,57" fill="url(#favRedGrad)" />
</svg>

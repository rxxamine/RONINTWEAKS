<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF383F" />
      <stop offset="50%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#B30F16" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base with Rounded Hexagon -->
  <rect width="32" height="32" rx="8" fill="#07070A" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="#FF1E27" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Bold, Highly Visible Cyber Ronin "R" + Katana Slash (Crisp at 16px/32px) -->
  <g filter="url(#neon)">
    <!-- Vertical Katana Spine -->
    <path d="M 7 6 L 12 6 L 12 26 L 7 26 Z" fill="url(#rGrad)" />
    
    <!-- Top Bow of R -->
    <path d="M 12 6 L 20 6 C 24 6 25.5 8.5 25.5 12 C 25.5 15.5 23.5 17.5 19.5 17.5 L 12 17.5 Z" fill="url(#rGrad)" />
    <!-- Inner Cutout -->
    <path d="M 12 10 L 19 10 C 20.5 10 21.5 10.8 21.5 12 C 21.5 13.2 20.5 14 19 14 L 12 14 Z" fill="#07070A" />

    <!-- Katana Diagonal Slash Leg -->
    <path d="M 16 16.5 L 24.5 26 L 19.5 26 L 12 17.5 Z" fill="url(#rGrad)" />

    <!-- Specular Blade Core Highlight -->
    <path d="M 9 7 L 11 7 L 11 25 L 9 25 Z" fill="#FFFFFF" opacity="0.35" />
    <path d="M 21.5 7 L 23 7 L 16.5 16 L 15 16 Z" fill="#FFFFFF" opacity="0.4" />
  </g>
</svg>
